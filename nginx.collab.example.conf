# Example: expose the collaboration WebSocket through nginx on your laptop.
# Terminate TLS at nginx (or at Cloudflare Tunnel / ngrok) and proxy to port 3001.

upstream locus_collab {
    server 127.0.0.1:3001;
}

server {
    listen 443 ssl;
    server_name collab.example.com;

    # ssl_certificate ...
    # ssl_certificate_key ...

    location / {
        proxy_pass http://locus_collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
